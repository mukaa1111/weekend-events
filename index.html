<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주말 뭐하지?</title>
<style>
  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --ink: #2b2a28;
    --muted: #7a756d;
    --line: #e9e3d9;
    --accent: #e0742f;
    --accent-soft: #fdebdd;
    --tag-science: #dbeafe;
    --tag-outdoor: #dcfce7;
    --tag-art: #fce7f3;
    --tag-festival: #fef3c7;
    --chip-on: #2b2a28;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }

  header h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.5px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 8px; align-items: center; }
  .filters .label { font-size: 13px; color: var(--muted); margin-right: 2px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer;
  }
  .chip.on { background: var(--chip-on); color: #fff; border-color: var(--chip-on); }
  .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }

  section { margin-top: 28px; }
  section h2 { font-size: 18px; margin: 0 0 4px; display: flex; align-items: baseline; gap: 8px; }
  section h2 small { font-size: 13px; color: var(--muted); font-weight: normal; }
  .empty { color: var(--muted); font-size: 14px; padding: 14px 0; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-top: 10px;
  }
  .card .row { display: flex; gap: 12px; align-items: flex-start; }
  .card .main { flex: 1; min-width: 0; }
  .thumb {
    position: relative; flex: 0 0 64px; width: 64px; height: 64px; border-radius: 12px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; font-size: 30px; background: #eee;
  }
  .thumb.과학 { background: var(--tag-science); }
  .thumb.야외 { background: var(--tag-outdoor); }
  .thumb.예술 { background: var(--tag-art); }
  .thumb.축제 { background: var(--tag-festival); }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card .top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .card .title { font-size: 17px; font-weight: 700; margin: 0; }
  .card .title a { color: inherit; text-decoration: none; }
  .card .title a:hover { text-decoration: underline; }
  .card .date { font-weight: 700; color: var(--accent); white-space: nowrap; font-size: 15px; }
  .card .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .card .meta span + span::before { content: " · "; color: var(--line); }
  .card .meta .travel { font-weight: 600; color: #1d4ed8; white-space: nowrap; }
  .card .note { font-size: 14px; margin-top: 8px; }
  .card .foot { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .tag { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: #eee; }
  .tag.과학 { background: var(--tag-science); }
  .tag.야외 { background: var(--tag-outdoor); }
  .tag.예술 { background: var(--tag-art); }
  .tag.축제 { background: var(--tag-festival); }
  .tag.venue { background: #f1f5f9; color: #334155; }
  .tag.venue.outdoor { background: #ecfdf5; color: #065f46; }
  .rain-chip.on { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
  .badge.free { color: #15803d; border-color: #bbf7d0; background: #f0fdf4; }
  .badge.resv { color: #b45309; border-color: #fde68a; background: #fffbeb; }
  .badge.unverified { color: #b91c1c; border-color: #fecaca; background: #fef2f2; }
  .badge.deadline { color: #9a3412; border-color: #fdba74; background: #fff7ed; font-weight: 700; }
  .badge.closed { color: var(--muted); text-decoration: line-through; }
  #sec-apply .card { border-color: #fdba74; }
  .card .src { margin-left: auto; font-size: 12px; color: var(--muted); }
  .dday { display: inline-block; margin-left: 6px; font-size: 12px; padding: 2px 7px; border-radius: 6px; background: #fff7ed; color: #9a3412; font-weight: 700; vertical-align: middle; }
  .dday.hot { background: #fef2f2; color: #b91c1c; }
  .card .actions { display: flex; gap: 6px; margin-top: 10px; }
  .card .actions a {
    flex: 1; text-align: center; font-size: 13px; padding: 7px 0; border-radius: 8px;
    border: 1px solid var(--line); color: var(--ink); text-decoration: none; background: #fafafa;
  }
  .card .actions a:active { background: var(--accent-soft); }
  .card .src a { color: var(--muted); }

  details { margin-top: 28px; }
  #sec-ongoing { margin-top: 14px; }
  #sec-ongoing summary { font-size: 14px; color: var(--muted); font-weight: 600; }
  summary { cursor: pointer; font-size: 16px; font-weight: 700; }
  .sources { margin-top: 10px; font-size: 14px; }
  .sources h3 { font-size: 14px; color: var(--muted); margin: 14px 0 4px; font-weight: normal; }
  .sources ul { margin: 0; padding-left: 18px; }
  .sources li.off { opacity: 0.45; }
  .sources li a { color: var(--ink); }
  .howto { font-size: 13px; color: var(--muted); margin-top: 10px; }

  footer { margin-top: 40px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }

  @media (max-width: 520px) {
    .card .top { flex-direction: column; gap: 2px; }
    .thumb { flex-basis: 56px; width: 56px; height: 56px; font-size: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>주말 뭐하지?</h1>
    <p id="today"></p>
  </header>

  <div class="filters" id="filters">
    <span class="label">분야</span>
    <button class="chip tag-chip" data-tag="과학">과학·만들기</button>
    <button class="chip tag-chip" data-tag="야외">운동·야외</button>
    <button class="chip tag-chip" data-tag="예술">예술·공연</button>
    <button class="chip tag-chip" data-tag="축제">축제·역사·도서관</button>
    <span class="sep"></span>
    <button class="chip rain-chip" id="rain-chip" title="실내이거나 실내 공간이 있는 행사만">☔ 비 와도 OK</button>
    <span class="sep"></span>
    <span class="label">비용</span>
    <button class="chip cost-chip on" data-cost="전체">전체</button>
    <button class="chip cost-chip" data-cost="무료">무료</button>
    <button class="chip cost-chip" data-cost="유료">유료</button>
    <span class="sep"></span>
    <span class="label">지역</span>
    <button class="chip region-chip on" data-region="전체">전체</button>
    <button class="chip region-chip" data-region="대전">대전</button>
    <button class="chip region-chip" data-region="근교">근교</button>
    <button class="chip region-chip" data-region="전국">전국</button>
  </div>

  <section id="sec-apply"><h2>예약 서두르기 <small>7일 안에 접수 마감·시작</small></h2><div class="list"></div></section>
  <section id="sec-this"><h2>이번 주말 <small id="range-this"></small></h2><div class="list"></div>
    <details id="sec-ongoing"><summary>계속 진행 중인 전시·체험 <span id="count-ongoing" style="font-weight:normal;color:var(--muted)"></span></summary><div class="list"></div></details>
  </section>
  <section id="sec-next"><h2>다음 주말 <small id="range-next"></small></h2><div class="list"></div></section>
  <section id="sec-big"><h2>미리 체크할 큰 행사 <small>약 6주 안 · 예약 서두를 것</small></h2><div class="list"></div></section>
  <section id="sec-nation"><h2>전국 큰 행사 <small>있을 때만</small></h2><div class="list"></div></section>

  <details id="sec-later">
    <summary>그 이후 행사 <span id="count-later" style="font-weight:normal;color:var(--muted)"></span></summary>
    <div class="list"></div>
  </details>

  <details>
    <summary>지금 보는 출처 <span id="count-sources" style="font-weight:normal;color:var(--muted)"></span></summary>
    <div class="sources" id="sources"></div>
    <p class="howto">출처를 더하고 싶으면 채팅에서 "출처에 ○○ 추가해줘 (주소)"라고 말하면 돼요. 파일은 <code>data/sources.js</code>.</p>
  </details>

  <footer>
    행사 정보는 바뀔 수 있어요. 가기 전에 출처 링크에서 날짜와 예약 여부를 한 번 더 확인하세요.
    "확인 필요" 표시는 아직 공식 페이지로 확인하지 않은 정보예요.
  </footer>
</div>

<script src="data/events.js"></script>
<script src="data/sources.js"></script>
<script>
(function () {
  // ---------- 날짜 도우미 ----------
  function parse(d) { var p = d.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmt(d) { return (d.getMonth() + 1) + "/" + d.getDate(); }
  function dayName(d) { return "일월화수목금토"[d.getDay()]; }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  var today = startOfDay(new Date());
  // 이번 주 일요일 (오늘이 일요일이면 오늘)
  var thisSun = addDays(today, (7 - today.getDay()) % 7);
  var thisStart = today;                 // 이번 주말 묶음: 오늘 ~ 이번 일요일
  var nextStart = addDays(thisSun, 1);   // 다음 주말 묶음: 다음 월 ~ 다음 일
  var nextEnd = addDays(thisSun, 7);
  var bigEnd = addDays(today, 42);       // 미리 체크: 약 6주
  var applyEnd = addDays(today, 7);      // 예약 서두르기: 7일 안

  var lastUpd = "";
  if (window.LAST_UPDATED) {                       // "2026-10-22 07:08" → "10/22(목) 07:08 수집"
    var lu = window.LAST_UPDATED.split(" ");
    var ld = parse(lu[0]);
    lastUpd = " · 마지막 수집 " + fmt(ld) + "(" + dayName(ld) + ") " + (lu[1] || "");
  }
  document.getElementById("today").textContent =
    "오늘 " + fmt(today) + "(" + dayName(today) + ") · 대전 + 차로 1시간 안쪽 · 초등 2학년 기준" + lastUpd;
  document.getElementById("range-this").textContent = fmt(thisStart) + " ~ " + fmt(thisSun);
  document.getElementById("range-next").textContent = fmt(nextStart) + " ~ " + fmt(nextEnd);

  // ---------- 필터 상태 ----------
  var state = { tags: [], cost: "전체", region: "전체", rain: false };

  document.getElementById("rain-chip").addEventListener("click", function () {
    state.rain = !state.rain;
    this.classList.toggle("on", state.rain);
    render();
  });

  document.querySelectorAll(".tag-chip").forEach(function (b) {
    b.addEventListener("click", function () {
      var t = b.dataset.tag, i = state.tags.indexOf(t);
      if (i >= 0) state.tags.splice(i, 1); else state.tags.push(t);
      b.classList.toggle("on");
      render();
    });
  });
  function single(cls, key) {
    document.querySelectorAll("." + cls).forEach(function (b) {
      b.addEventListener("click", function () {
        document.querySelectorAll("." + cls).forEach(function (x) { x.classList.remove("on"); });
        b.classList.add("on");
        state[key] = b.dataset[key];
        render();
      });
    });
  }
  single("cost-chip", "cost");
  single("region-chip", "region");

  function passes(e) {
    if (state.tags.length && !state.tags.some(function (t) { return e.tags.indexOf(t) >= 0; })) return false;
    if (state.cost === "무료" && e.cost !== "무료") return false;
    if (state.cost === "유료" && e.cost === "무료") return false;
    if (state.region !== "전체" && e.region !== state.region) return false;
    if (state.rain && !(e.indoor === true || e.indoor === "both")) return false;   // 비 와도 OK = 실내 또는 실내+야외
    return true;
  }

  // ---------- 묶음 나누기 ----------
  function overlaps(e, a, b) { return parse(e.start) <= b && parse(e.end) >= a; }

  // 접수 마감·시작이 7일 안이면 "예약 서두르기"
  function applyDate(e) {
    // 시작일·마감일 중 7일 안에 드는 가장 가까운 날짜 (인기 프로그램은 시작일이 더 중요)
    var cands = [e.applyStart, e.deadline].filter(Boolean).map(parse)
      .filter(function (d) { return d >= today && d <= applyEnd; })
      .sort(function (a, b) { return a - b; });
    return cands.length ? cands[0] : null;
  }

  // 2주 넘게 이어지는 전시·체험은 "계속 진행 중"으로 접어 둔다 (이번 주말 묶음이 길어지지 않게)
  function isOngoing(e) { return daysLeft(parse(e.end)) - daysLeft(parse(e.start)) >= 14; }

  function group(events) {
    var g = { apply: [], thisW: [], ongoing: [], nextW: [], big: [], nation: [], later: [] };
    events.forEach(function (e) {
      if (parse(e.end) < today) return;            // 지난 행사 숨김
      if (applyDate(e)) g.apply.push(e);           // 다른 묶음에도 그대로 보임
      if (e.region === "전국") { g.nation.push(e); return; }
      if (overlaps(e, thisStart, thisSun)) { (isOngoing(e) ? g.ongoing : g.thisW).push(e); return; }
      if (overlaps(e, nextStart, nextEnd)) { g.nextW.push(e); return; }
      if (e.big && parse(e.start) <= bigEnd) { g.big.push(e); return; }
      g.later.push(e);
    });
    var byDate = function (a, b) { return parse(a.start) - parse(b.start); };
    Object.keys(g).forEach(function (k) { g[k].sort(byDate); });
    g.apply.sort(function (a, b) { return applyDate(a) - applyDate(b); });
    g.ongoing.sort(function (a, b) { return parse(a.end) - parse(b.end); });   // 곧 끝나는 것부터
    return g;
  }

  // ---------- 카드 그리기 ----------
  var ICON = { "과학": "🔬", "야외": "🌳", "예술": "🎭", "축제": "🎪" };

  // 대전(둔산 기준)에서 가는 시간. 도시 이름이 포함되면 적용. 행사에 travel 값이 있으면 그걸 우선 씀
  var TRAVEL = [
    ["대전", "대전 시내"], ["세종", "차 40분"], ["계룡", "차 30분"], ["옥천", "차 40분"],
    ["청주", "차 1시간"], ["공주", "차 50분"], ["논산", "차 50분"], ["금산", "차 50분"],
    ["부여", "차 1시간 10분"], ["천안", "차 1시간 10분"], ["김천", "차 1시간 20분"], ["문경", "차 1시간 30분"],
    ["서울", "KTX 1시간 · 차 2시간"], ["과천", "차 2시간"], ["인천", "차 2시간 30분"], ["부산", "KTX 1시간 30분 · 차 3시간"],
    ["강원", "차 2시간 30분"], ["광주", "KTX 1시간 · 차 2시간"]
  ];
  function travel(e) {
    if (e.travel) return e.travel;
    var c = e.city || "";
    for (var i = 0; i < TRAVEL.length; i++) if (c.indexOf(TRAVEL[i][0]) >= 0) return TRAVEL[i][1];
    return "";
  }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  // 오늘부터 며칠 남았는지 (0 = 오늘)
  function daysLeft(d) { return Math.round((d - today) / 86400000); }
  function dday(d, what) {           // what: "종료" | "접수 마감" | "접수 시작"
    var n = daysLeft(d);
    if (n < 0 || n > 7) return "";
    var cls = n <= 3 ? "dday hot" : "dday";
    var txt = n === 0 ? "오늘 " + what : what + " D-" + n;
    return '<span class="' + cls + '">' + txt + '</span>';
  }

  // 길찾기·캘린더·공유 링크
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()); }
  function calendarUrl(e) {
    var s = parse(e.start), t = addDays(parse(e.end), 1);   // 구글 캘린더 종일 일정은 끝 날짜가 하루 뒤
    var details = [e.time, e.place, e.price || e.cost, e.applyNote, e.note, e.url].filter(Boolean).join("\n");
    return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
      "&text=" + encodeURIComponent(e.title) +
      "&dates=" + ymd(s) + "/" + ymd(t) +
      "&location=" + encodeURIComponent(e.place + " " + (e.city || "")) +
      "&details=" + encodeURIComponent(details);
  }
  function mapUrl(e) { return "https://map.naver.com/p/search/" + encodeURIComponent(e.place); }
  function shareText(e) {
    return e.title + "\n" + dateLabel(e) + " " + e.time + "\n" + e.place + " (" + e.city + ")\n" +
      (e.cost + (e.price ? " · " + e.price : "")) + (e.reservation ? " · 예약 필요" : "") + "\n" + e.url;
  }
  window.shareEvent = function (id) {
    var e = (window.EVENTS || []).filter(function (x) { return x.id === id; })[0];
    if (!e) return;
    var text = shareText(e);
    if (navigator.share) {
      navigator.share({ title: e.title, text: text }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () { alert("행사 정보를 복사했어요. 붙여넣기 하세요."); });
    } else {
      prompt("복사해서 공유하세요", text);
    }
  };

  function dateLabel(e) {
    var s = parse(e.start), t = parse(e.end);
    var a = fmt(s) + "(" + dayName(s) + ")";
    if (e.start === e.end) return a;
    return a + " ~ " + fmt(t) + "(" + dayName(t) + ")";
  }

  function card(e) {
    var badges = "";
    if (e.cost === "무료") badges += '<span class="badge free">무료</span>';
    else badges += '<span class="badge">' + esc(e.cost) + (e.price ? " · " + esc(e.price) : "") + "</span>";
    if (e.reservation) badges += '<span class="badge resv">예약 필요</span>';
    if (e.applyStart && parse(e.applyStart) >= today) {
      var ap = parse(e.applyStart);   // 시작일이 아직 안 지났으면 항상 표시 (오픈 직후 매진 대비)
      badges += '<span class="badge deadline">접수 시작 ' + fmt(ap) + '(' + dayName(ap) + ')' + (e.applyTime ? ' ' + esc(e.applyTime) : '') + '</span>' + dday(ap, "접수 시작");
    }
    if (e.deadline) {
      var dl = parse(e.deadline);
      if (dl < today) badges += '<span class="badge closed">접수 마감됨 ' + fmt(dl) + '</span>';
      else badges += '<span class="badge deadline">접수 마감 ' + fmt(dl) + '(' + dayName(dl) + ')</span>' + dday(dl, "접수 마감");
    }
    var endD = dday(parse(e.end), "종료");   // 행사 자체가 7일 안에 끝나면 날짜 옆에 표시
    var actions = '<div class="actions">' +
      '<a href="' + mapUrl(e) + '" target="_blank" rel="noopener">길찾기</a>' +
      '<a href="' + calendarUrl(e) + '" target="_blank" rel="noopener">캘린더</a>' +
      '<a href="#" onclick="shareEvent(\'' + esc(e.id) + '\');return false;">공유</a>' +
      '</div>';
    if (e.applyNote) badges += '<span class="badge">' + esc(e.applyNote) + '</span>';
    if (e.verified === false) badges += '<span class="badge unverified">확인 필요</span>';
    var tags = (e.tags || []).map(function (t) { return '<span class="tag ' + esc(t) + '">' + esc(t) + "</span>"; }).join("");
    if (e.indoor === true) tags += '<span class="tag venue">실내</span>';
    else if (e.indoor === "both") tags += '<span class="tag venue">실내+야외</span>';
    else if (e.indoor === false) tags += '<span class="tag venue outdoor">야외</span>';
    // 왼쪽 섬네일: 분야 아이콘, 공식 포스터 주소(image)가 있으면 그 위에 사진. 사진이 안 열리면 아이콘만 남음
    var first = (e.tags && e.tags[0]) || "축제";
    var thumb = '<div class="thumb ' + esc(first) + '"><span class="icon">' + (ICON[first] || "📌") + '</span>' +
      (e.image ? '<img src="' + esc(e.image) + '" alt="" loading="lazy" onerror="this.remove()">' : "") + '</div>';
    return '<article class="card"><div class="row">' + thumb + '<div class="main">' +
      '<div class="top"><h3 class="title"><a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.title) + '</a></h3>' +
      '<div class="date">' + dateLabel(e) + endD + '</div></div>' +
      '<div class="meta"><span>' + esc(e.time) + '</span><span>' + esc(e.place) + '</span><span>' + esc(e.city) +
        (travel(e) && travel(e) !== "대전 시내" ? ' <b class="travel">🚗 ' + esc(travel(e)) + '</b>' : '') + '</span><span>' + esc(e.ages) + '</span></div>' +
      (e.note ? '<div class="note">' + esc(e.note) + "</div>" : "") +
      '<div class="foot">' + tags + badges +
      '<span class="src">출처: <a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.source) + "</a></span></div>" +
      '</div></div>' +
      actions +
      "</article>";
  }

  function fill(secId, list, emptyMsg) {
    var el = document.querySelector("#" + secId + " .list");
    el.innerHTML = list.length ? list.map(card).join("") : '<div class="empty">' + emptyMsg + "</div>";
  }

  function render() {
    var events = (window.EVENTS || []).filter(passes);
    var g = group(events);
    var applySec = document.getElementById("sec-apply");
    applySec.style.display = g.apply.length ? "" : "none";   // 없으면 묶음 자체를 숨김
    fill("sec-apply", g.apply, "");
    fill("sec-this", g.thisW, g.ongoing.length ? "이번 주말에만 열리는 행사는 없어요. 아래 '계속 진행 중'을 펼쳐 보세요." : "이번 주말엔 조건에 맞는 행사가 없어요.");
    var ongoingEl = document.getElementById("sec-ongoing");
    ongoingEl.style.display = g.ongoing.length ? "" : "none";
    ongoingEl.querySelector(".list").innerHTML = g.ongoing.map(card).join("");
    document.getElementById("count-ongoing").textContent = "(" + g.ongoing.length + "건 · 끝나는 날 순)";
    fill("sec-next", g.nextW, "다음 주말 행사가 아직 없어요. 수집을 돌려 보세요.");
    fill("sec-big", g.big, "미리 체크할 큰 행사가 없어요.");
    fill("sec-nation", g.nation, "지금은 전국 큰 행사가 없어요.");
    fill("sec-later", g.later, "그 이후 행사가 없어요.");
    document.getElementById("count-later").textContent = g.later.length ? "(" + g.later.length + "건)" : "";
  }

  // ---------- 출처 목록 ----------
  function renderSources() {
    var src = window.SOURCES || [];
    var order = ["대전", "근교", "보완", "전국"];
    var html = "";
    order.forEach(function (r) {
      var items = src.filter(function (s) { return s.region === r; });
      if (!items.length) return;
      html += "<h3>" + r + " (" + items.length + ")</h3><ul>" + items.map(function (s) {
        return '<li class="' + (s.active === false ? "off" : "") + '"><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + "</a>" +
          ' <span style="color:var(--muted);font-size:12px">' + esc(s.type) + (s.active === false ? " · 잠시 끔" : "") + (s.note ? " · " + esc(s.note) : "") + "</span></li>";
      }).join("") + "</ul>";
    });
    document.getElementById("sources").innerHTML = html;
    var on = src.filter(function (s) { return s.active !== false; }).length;
    document.getElementById("count-sources").textContent = "(" + on + "곳)";
  }

  render();
  renderSources();
})();
</script>
</body>
</html>
